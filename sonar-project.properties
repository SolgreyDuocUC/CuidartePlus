# Identificador único de tu proyecto en SonarQube
sonar.projectKey=cuidarteplus

# Nombre visible del proyecto
sonar.projectName=CuidartePlus

# Versión del proyecto
sonar.projectVersion=1.0

# Rutas del código fuente a analizar (relativas a la raíz)
sonar.sources=backend/src,frontend/src

# Exclusiones opcionales (librerías, compilados, uploads y temporales)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/uploads/**

# Codificación de archivos
sonar.sourceEncoding=UTF-8
