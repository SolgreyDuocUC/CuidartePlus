name: Build & Deploy Cuidarte+

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio por defecto; cada job pide solo lo que necesita
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR exige nombres en minúsculas
  IMAGE_PREFIX: ghcr.io/solgreyduocuc/cuidarteplus

jobs:
  # 1) Construye las imágenes en cada push/PR para validar que el proyecto compila
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./BACKEND
          - service: frontend
            context: ./FRONTEND
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/deploy'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (y push solo en la rama deploy)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/deploy' }}
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          # Vincula la imagen al repo para que se puedan gestionar permisos de GHCR
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 2) Despliega en EC2 por SSH descargando las imágenes desde GHCR
  deploy:
    name: Deploy en EC2
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/deploy' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy vía SSH con docker compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          # Configuración de la app: se escribe en .env en la EC2
          APP_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          APP_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'cuidarteplus-ev' }}
          APP_NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
          APP_PORT_FRONTEND: ${{ vars.PORT_FRONTEND || '3333' }}
          APP_FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG,APP_POSTGRES_USER,APP_POSTGRES_PASSWORD,APP_POSTGRES_DB,APP_JWT_SECRET,APP_COMPOSE_PROJECT_NAME,APP_NODE_ENV,APP_PORT_FRONTEND,APP_FRONTEND_URL
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/home/ubuntu/CuidartePlus' }}
            git fetch origin deploy
            git reset --hard origin/deploy
            mkdir -p BACKEND/uploads/documentos

            # Genera el .env a partir de los secrets/variables de GitHub (solo legible por el usuario)
            umask 077
            {
              printf 'COMPOSE_PROJECT_NAME=%s\n' "$APP_COMPOSE_PROJECT_NAME"
              printf 'NODE_ENV=%s\n' "$APP_NODE_ENV"
              printf 'POSTGRES_USER=%s\n' "$APP_POSTGRES_USER"
              printf 'POSTGRES_PASSWORD=%s\n' "$APP_POSTGRES_PASSWORD"
              printf 'POSTGRES_DB=%s\n' "$APP_POSTGRES_DB"
              printf 'JWT_SECRET=%s\n' "$APP_JWT_SECRET"
              printf 'PORT_FRONTEND=%s\n' "$APP_PORT_FRONTEND"
              printf 'FRONTEND_URL=%s\n' "$APP_FRONTEND_URL"
            } > .env
            umask 022

            # Autenticación en GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Exportar la variable para que docker compose.prod.yml lea el tag exacto
            export IMAGE_TAG="${{ github.sha }}"

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # Descarga todas las imágenes definidas sin forzar nombres específicos de servicios
            $COMPOSE pull
            $COMPOSE up -d --no-build --remove-orphans

            docker logout ghcr.io
            docker image prune -f
